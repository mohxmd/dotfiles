# ─────────────────────────────────────────────────────────────
# FONT CONFIGURATION
# ─────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
italic_font      JetBrainsMono Nerd Font Italic
bold_font        JetBrainsMono Nerd Font Bold
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.5

adjust_line_height 2
adjust_column_width 0
disable_ligatures  never

# ─────────────────────────────────────────────────────────────
# WINDOW BEHAVIOR
# ─────────────────────────────────────────────────────────────

window_padding_width     12
enable_audio_bell        no
remember_window_size     no
initial_window_width     1000
initial_window_height    620
placement_strategy       center
hide_window_decorations  titlebar-only
confirm_os_window_close  0
shell                    zsh

# ─────────────────────────────────────────────────────────────
# PERFORMANCE & LATENCY
# ─────────────────────────────────────────────────────────────

repaint_delay    10
input_delay      1
sync_to_monitor  yes

# ─────────────────────────────────────────────────────────────
# SCROLLBACK
# ─────────────────────────────────────────────────────────────

scrollback_lines               5000
scrollback_pager_history_size  64

# ─────────────────────────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────────────────────────

map ctrl+shift+enter new_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+w     close_tab
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard

# ─────────────────────────────────────────────────────────────
# COLOR PALETTE — Dark Monochrome
# ─────────────────────────────────────────────────────────────

foreground            #a6a6a6
background            #080808
background_opacity    0.98

selection_foreground  #c4c4c4
selection_background  #1a1a1a

cursor                #c4c4c4
cursor_text_color     #080808

url_color             #8a8a8a
active_border_color   #1a1a1a
inactive_border_color #121212

