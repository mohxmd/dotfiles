# ─────────────────────────────────────────────────────────────
# HYPRLOCK CONFIGURATION — Minimal Dark Monochrome
# ─────────────────────────────────────────────────────────────

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/hypr/lockscreen.png
    color = rgba(11, 11, 11, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.01
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 240, 240, 0.9)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(160, 160, 160, 0.8)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(18, 18, 18, 0.9)
    font_color = rgba(240, 240, 240, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password...</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}
