# ─────────────────────────────────────────────────────────────
# HYPRLAND MAIN CONFIGURATION
# ─────────────────────────────────────────────────────────────

# Environment variables
source = ~/.config/hypr/conf/env.conf

# Input & gestures
source = ~/.config/hypr/conf/input.conf

# Autostart applications & background daemons
source = ~/.config/hypr/conf/autostart.conf

# Window rules & layer rules
source = ~/.config/hypr/conf/windowrules.conf

# Animations
source = ~/.config/hypr/conf/animations.conf

# Window decorations, blur, gaps & layout
source = ~/.config/hypr/conf/decorations.conf

# Keybindings & application shortcuts
source = ~/.config/hypr/conf/keybindings.conf

# Dynamic color scheme (generated via matugen from wallpaper)
source = ~/.config/hypr/colors.conf

# Per-host configuration (monitors, scaling, GPU env)
source = ~/.config/hypr/host.conf

# User custom overrides (loaded last)
source = ~/.config/hypr/conf/custom.conf
