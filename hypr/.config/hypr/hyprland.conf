# ─────────────────────────────────────────────────────────────
# HYPRLAND CONFIGURATION — Minimal & High Performance
# ─────────────────────────────────────────────────────────────

# Monitors (generic fallback for any display/laptop screen)
monitor=,preferred,auto,1

# Default Applications
$terminal    = kitty
$fileManager = dolphin
$menu        = rofi -show drun
$browser     = firefox

# ─────────────────────────────────────────────────────────────
# AUTOSTART
# ─────────────────────────────────────────────────────────────

exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ─────────────────────────────────────────────────────────────
# INPUT CONFIGURATION
# ─────────────────────────────────────────────────────────────

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# ─────────────────────────────────────────────────────────────
# GENERAL LAYOUT
# ─────────────────────────────────────────────────────────────

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(ffffffff) rgba(ffffffff) 45deg
    col.inactive_border = rgba(00000000)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# ─────────────────────────────────────────────────────────────
# DECORATION & OPTIMIZATIONS (LOW SPEC TUNING)
# ─────────────────────────────────────────────────────────────

decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 0.98

    # Disabled for maximum GPU efficiency and zero stutter
    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# ─────────────────────────────────────────────────────────────
# ANIMATIONS
# ─────────────────────────────────────────────────────────────

animations {
    enabled = true

    bezier = smoothOut, 0.25, 0.9, 0.35, 1.0
    bezier = smoothInOut, 0.4, 0.0, 0.2, 1.0
    bezier = subtle, 0.22, 0.9, 0.3, 1.0
    bezier = stylish, 0.2, 1.0, 0.15, 1.0

    animation = windows, 1, 4, stylish, popin 96%
    animation = windowsOut, 1, 4, smoothInOut, popin 96%
    animation = border, 1, 6, subtle
    animation = fade, 1, 4, smoothInOut
    animation = layersIn, 1, 4, subtle, slide bottom
    animation = layersOut, 1, 4, smoothInOut, slide bottom
    animation = fadeLayersIn, 1, 4, subtle
    animation = fadeLayersOut, 1, 4, smoothInOut
    animation = workspaces, 1, 4, stylish, slide
}

# ─────────────────────────────────────────────────────────────
# LAYOUT SPECIFICS
# ─────────────────────────────────────────────────────────────

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ─────────────────────────────────────────────────────────────
# MISCELLANEOUS PERFORMANCE SETTINGS
# ─────────────────────────────────────────────────────────────

misc {
    vrr = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ─────────────────────────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────────────────────────

$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Escape, exec, $HOME/.config/rofi/bin/powermenu

# Window Management
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, F, togglefloating
bind = $mainMod, Space, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, T, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod, R, exec, hyprctl reload

# Screenshot
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S').png

# Hardware Audio Controls (wpctl)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Hardware Brightness Controls (brightnessctl)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media Player Controls (playerctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Focus Movement (Vim & Arrow keys)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window Movement (Vim & Arrow keys)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces (1 - 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace (1 - 10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Window Actions
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─────────────────────────────────────────────────────────────
# WINDOW RULES
# ─────────────────────────────────────────────────────────────

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.92 0.98
}

windowrule {
    name = floating-tools
    match:class = ^(pavucontrol|blueman-manager|nm-connection-editor)$
    float = true
}
