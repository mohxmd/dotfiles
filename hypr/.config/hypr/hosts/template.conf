# ─────────────────────────────────────────────────────────────
# HOST CONFIGURATION TEMPLATE
# Copy to <hostname>.conf to customize per machine.
# Only machine differences belong here: monitors, scale, GPU env, touchpad.
# ─────────────────────────────────────────────────────────────

# --- Monitor & Scaling (Single Source of Truth for Display Scale) ---
# Format: monitor = name, resolution@rate, position, scale
# Examples:
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = DP-1, 2560x1440@144, 1920x0, 1
# monitor = DP-2, 3840x2160@60, 0x0, 1.5
monitor = ,preferred,auto,1

# --- GPU / NVIDIA Environment (Desktop / Dedicated GPU) ---
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct

# --- Laptop Specifics (Touchpad / Clamshell) ---
# input {
#     touchpad {
#         natural_scroll = true
#         tap_to_click = true
#         drag_lock = true
#     }
# }
