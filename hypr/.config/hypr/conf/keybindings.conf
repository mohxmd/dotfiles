# ─────────────────────────────────────────────────────────────
# KEYBINDINGS — Standard Layout
# ─────────────────────────────────────────────────────────────

$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts

# Applications
$terminal    = kitty
$browser     = firefox
$fileManager = dolphin
$menu        = rofi -show drun

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod CTRL, RETURN, exec, $menu
bind = $mainMod, D, exec, $menu

# Windows
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, exec, $HYPRSCRIPTS/toggle-allfloat.sh
bind = $mainMod ALT, T, exec, $HYPRSCRIPTS/toggle-float-pin.sh
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, K, layoutmsg, swapsplit
bind = $mainMod, G, togglegroup

# Navigation — Focus (Super + Arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Navigation — Window Resizing (Super + Shift + Arrows)
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100

# Navigation — Swap Tiled Windows (Super + Alt + Arrows)
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Navigation — Window Movement (Vim Keys: Super + Shift + H/J/K/L)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Mouse Window Actions
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Window Cycling
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Display Zoom
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}")
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}")
bind = $mainMod SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 1

# Actions & System Tools
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/toggle-animations.sh
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod ALT, F, exec, $HYPRSCRIPTS/screenshot.sh --instant
bind = $mainMod ALT, S, exec, $HYPRSCRIPTS/screenshot.sh --instant-area
bind = $mainMod CTRL, P, exec, wlogout
bind = $mainMod, Escape, exec, wlogout
bind = $mainMod CTRL, W, exec, $HYPRSCRIPTS/wallpaper-picker.sh
bind = $mainMod SHIFT, W, exec, $HYPRSCRIPTS/wallpaper.sh --random
bind = $mainMod, V, exec, $HYPRSCRIPTS/cliphist.sh
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh
bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh
bind = $mainMod CTRL, K, exec, $HYPRSCRIPTS/keybindings.sh
bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh
bind = $mainMod CTRL, L, exec, pidof hyprlock || hyprlock

# Workspaces (1 - 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace (1 - 10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, down, workspace, empty

# Hardware Keys — Audio & Media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# Hardware Keys — Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q s 5%-
bindl  = , XF86Lock, exec, pidof hyprlock || hyprlock
