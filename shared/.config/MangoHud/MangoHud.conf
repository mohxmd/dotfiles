# ==============================================================================
# MangoHud Configuration (Vulkan & OpenGL Performance Overlay)
# Shared across KDE Plasma and Hyprland
# Toggle HUD: Right-Shift + F12
# ==============================================================================

legacy_layout=false
position=top-left
round_corners=10
background_alpha=0.5
background_color=020202
text_color=ffffff
font_size=14
table_columns=3

# GPU monitoring
gpu_stats
gpu_name
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_load_change
gpu_load_value=50,90
gpu_load_color=FFFFFF,FFAA7F,CC0000
gpu_color=2e9762

# CPU monitoring
cpu_stats
cpu_temp
core_load
core_load_change
cpu_power
cpu_mhz
cpu_load_value=50,90
cpu_load_color=FFFFFF,FFAA7F,CC0000
cpu_color=2e97cb

# Memory & VRAM
vram
vram_color=ad64c1
ram
ram_color=c26693
swap
io_color=a491d3

# Performance & Frame Timing
fps
frame_timing=1
frametime_color=00ff00
show_fps_limit
throttling_status

# Engine & API details
engine_version
engine_color=eb5b5b
vulkan_driver
wine
wine_color=eb5b5b
gamemode

# System time & Hotkeys
time
toggle_hud=Shift_R+F12
toggle_fps_limit=F1
toggle_logging=Shift_L+F2

