# ─────────────────────────────────────────────────────────────
# TMUX CONFIGURATION
# ─────────────────────────────────────────────────────────────

# Options & true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Prefix (Ctrl+a)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Ergonomics & behavior
set -s escape-time 0
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Keybindings & splits in current working directory
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Seamless Neovim navigation (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Pane resizing (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Statusline & theme
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold] #S #[bg=default,fg=default] "
set -g status-left-length 50
set -g status-right "#[fg=#565f89]%Y-%m-%d #[fg=#7aa2f7,bold]%H:%M "
set -g status-right-length 50

setw -g window-status-current-style "bg=#24283b,fg=#7aa2f7,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "bg=default,fg=#565f89"
setw -g window-status-format " #I:#W#F "

set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"
